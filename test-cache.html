<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cache Supabase</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 20px 0;
            color: #1a1a1a;
        }
        h2 {
            margin: 0 0 16px 0;
            color: #333;
            font-size: 18px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.secondary {
            background: #64748b;
        }
        button.secondary:hover {
            background: #475569;
        }
        button.danger {
            background: #dc2626;
        }
        button.danger:hover {
            background: #b91c1c;
        }
        #stats {
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre;
            border: 1px solid #e2e8f0;
        }
        #log {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 4px;
        }
        .log-hit {
            color: #22c55e;
        }
        .log-miss {
            color: #f59e0b;
        }
        .log-error {
            color: #ef4444;
        }
        .status-good {
            color: #22c55e;
            font-weight: 600;
        }
        .status-warn {
            color: #f59e0b;
            font-weight: 600;
        }
        .status-bad {
            color: #ef4444;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="test-panel">
        <h1>🧪 Test Cache Supabase</h1>
        <p>Ce script teste le système de cache et mesure les performances.</p>
    </div>

    <div class="test-panel">
        <h2>🎮 Actions de test</h2>
        <button onclick="testProducts()">Test 1: Charger produits (×10)</button>
        <button onclick="testMultipleTables()">Test 2: Tables multiples</button>
        <button onclick="testCacheHit()">Test 3: Vérifier cache hit</button>
        <button class="secondary" onclick="showStats()">📊 Afficher stats</button>
        <button class="secondary" onclick="toggleDebug()">🐛 Toggle debug</button>
        <button class="danger" onclick="clearCache()">🗑️ Vider cache</button>
    </div>

    <div class="test-panel">
        <h2>📊 Statistiques</h2>
        <div id="stats">Cliquez sur "Afficher stats" pour voir les résultats...</div>
    </div>

    <div class="test-panel">
        <h2>📝 Log en temps réel</h2>
        <div id="log"></div>
    </div>

    <script src="supabase-cache-layer.js"></script>
    <script>
        // Configuration Supabase
        const supabaseUrl = 'https://jvyvilqdnbjavxbwysdb.supabase.co/rest/v1/';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXZpbHFkbmJqYXZ4Ynd5c2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjE1NDIsImV4cCI6MjA5ODQ5NzU0Mn0.8GetwBw6mZuwtvIQQdu6ARHQ2g_1tOdrkmTHpTO4ZbM';

        const headers = {
            'apikey': supabaseKey,
            'Authorization': `Bearer ${supabaseKey}`,
            'Content-Type': 'application/json'
        };

        let debugEnabled = false;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'hit' ? 'log-hit' : type === 'miss' ? 'log-miss' : type === 'error' ? 'log-error' : '';
            logDiv.innerHTML += `<div class="log-entry ${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testProducts() {
            log('🚀 Test 1 démarré: Chargement produits ×10');
            const startTime = Date.now();
            
            for (let i = 1; i <= 10; i++) {
                try {
                    const response = await fetch(`${supabaseUrl}products?select=id,code_article,designation&limit=50`, {
                        headers
                    });
                    
                    if (response.ok) {
                        const cacheStatus = response.headers.get('X-Cache') || 'MISS';
                        log(`  ↳ Requête ${i}/10: ${cacheStatus}`, cacheStatus === 'HIT' ? 'hit' : 'miss');
                    } else {
                        log(`  ↳ Requête ${i}/10: ERREUR ${response.status}`, 'error');
                    }
                } catch (error) {
                    log(`  ↳ Requête ${i}/10: ERREUR ${error.message}`, 'error');
                }
                
                // Petit délai pour voir l'effet
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            const duration = Date.now() - startTime;
            log(`✅ Test 1 terminé en ${duration}ms`);
            showStats();
        }

        async function testMultipleTables() {
            log('🚀 Test 2 démarré: Tables multiples');
            
            const tables = [
                'products?limit=10',
                'customers?limit=10',
                'suppliers?limit=10',
                'mutuelles?limit=10',
                'web_categories?limit=10'
            ];
            
            for (const table of tables) {
                try {
                    const tableName = table.split('?')[0];
                    const response = await fetch(`${supabaseUrl}${table}`, { headers });
                    const cacheStatus = response.headers.get('X-Cache') || 'MISS';
                    log(`  ↳ ${tableName}: ${cacheStatus}`, cacheStatus === 'HIT' ? 'hit' : 'miss');
                } catch (error) {
                    log(`  ↳ ERREUR: ${error.message}`, 'error');
                }
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            
            log('✅ Test 2 terminé');
            showStats();
        }

        async function testCacheHit() {
            log('🚀 Test 3 démarré: Vérification cache hit');
            
            // Première requête (devrait être un MISS)
            const url = `${supabaseUrl}products?select=id,designation&limit=5`;
            
            log('  ↳ Première requête...');
            const response1 = await fetch(url, { headers });
            const status1 = response1.headers.get('X-Cache') || 'MISS';
            log(`    Status: ${status1}`, status1 === 'HIT' ? 'hit' : 'miss');
            
            // Attendre 500ms
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // Deuxième requête (devrait être un HIT)
            log('  ↳ Deuxième requête (devrait être HIT)...');
            const response2 = await fetch(url, { headers });
            const status2 = response2.headers.get('X-Cache') || 'MISS';
            log(`    Status: ${status2}`, status2 === 'HIT' ? 'hit' : 'miss');
            
            if (status2 === 'HIT') {
                log('✅ Test 3 réussi: Cache fonctionne correctement!');
            } else {
                log('❌ Test 3 échoué: Cache ne fonctionne pas', 'error');
            }
            
            showStats();
        }

        function showStats() {
            const stats = SUPABASE_CACHE.getStats();
            const statsDiv = document.getElementById('stats');
            
            let hitRateClass = 'status-good';
            const hitRateValue = parseFloat(stats.hitRate);
            if (hitRateValue < 50) hitRateClass = 'status-bad';
            else if (hitRateValue < 75) hitRateClass = 'status-warn';
            
            statsDiv.innerHTML = `
Entrées en cache:     ${stats.entries}
Cache hits:           ${stats.hits}
Cache misses:         ${stats.misses}
Hit rate:             <span class="${hitRateClass}">${stats.hitRate}</span>
Données économisées:  <span class="status-good">${stats.bytesSaved}</span>
Données servies:      ${stats.bytesServed}

${hitRateValue > 0 ? (
    hitRateValue >= 75 ? '🎉 Excellent! Le cache fonctionne très bien.' :
    hitRateValue >= 50 ? '👍 Bien! Le cache est efficace.' :
    '⚠️  Attention: Hit rate faible, attendez quelques minutes.'
) : '💡 Faites des tests pour voir les résultats.'}
            `.trim();
            
            log('📊 Stats affichées');
        }

        function toggleDebug() {
            debugEnabled = !debugEnabled;
            SUPABASE_CACHE.setDebug(debugEnabled);
            log(`🐛 Mode debug: ${debugEnabled ? 'ACTIVÉ' : 'DÉSACTIVÉ'}`);
        }

        function clearCache() {
            SUPABASE_CACHE.clear();
            log('🗑️ Cache vidé', 'error');
            showStats();
        }

        // Message de bienvenue
        log('✅ Système de test prêt');
        log('💡 Lancez les tests avec les boutons ci-dessus');
    </script>
</body>
</html>
